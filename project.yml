name: PugetRoute

options:
  bundleIdPrefix: com.pugetroute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # ← fill in your Apple Developer team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PugetRoute:
    type: application
    platform: iOS
    sources:
      - path: PugetRoute
        excludes:
          - "Info.plist.snippets.md"   # reference doc, not code
    info:
      path: PugetRoute/Info.plist
      properties:
        CFBundleDisplayName: BikeBusSeattle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # --- runtime permissions ---
        NSLocationWhenInUseUsageDescription: "BikeBusSeattle uses your location to plan trips from where you are."
        # --- DEV ONLY: allow plaintext HTTP to a local OTP backend ---
        # Remove this block before shipping and put TLS in front of OTP.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bikebusseattle.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PugetRoute/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
